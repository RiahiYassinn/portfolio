[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/speech"
  to = "/.netlify/functions/speech"
  status = 200

[[redirects]]
  from = "/api/match"
  to = "/.netlify/functions/match"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
